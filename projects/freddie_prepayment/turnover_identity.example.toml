[data]
panel_path = "${FREDDIE_DATA_ROOT}/prepared/prepayment_800k/panel.parquet"
output_root = "${FREDDIE_DATA_ROOT}/models/turnover_v1_identity"

[cohort]
incentive_max = -0.5

[fit]
block_link = "identity"   # linear factors fitted by BCD; the default config fits the log-link GLM
n_iterations = 60
early_stopping_rounds = 10
ftol = 1e-5
