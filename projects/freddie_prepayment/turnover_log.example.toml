[data]
panel_path = "${FREDDIE_DATA_ROOT}/prepared/prepayment_800k/panel.parquet"
output_root = "${FREDDIE_DATA_ROOT}/models/turnover_v1_log"

[cohort]
incentive_max = -0.5

[fit]
block_link = "log"   # log-link Poisson GLM fitted by Newton; BCD settings do not apply

[fit.newton]
design_cache = "auto"   # cache the float32 design when it is at most max_cache_gb
max_cache_gb = 16
