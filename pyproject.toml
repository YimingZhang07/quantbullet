[project]
name = "quantbullet"
version = "0.1.1"
description = "Toolkit for swift quant analysis"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yiming Zhang" }]
requires-python = ">=3.11"
keywords = ["quantitative-finance", "statistics", "regime-switching", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "matplotlib>=3.8",
    "cvxpy>=1.4",
    "pandas>=2.1",
    "polars>=1.0",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "seaborn>=0.13",
    "optuna>=3.4",
    "pygam>=0.12.0 ; python_version < '3.15'",
    "numpy",
    "scipy",
    "numexpr",
    "lazy-loader",
    "cryptography",
    "sqlalchemy",
    "openpyxl",
    "reportlab",
    "pypdf",
]

[project.urls]
Homepage = "https://github.com/YimingZhang07/quantbullet"
Repository = "https://github.com/YimingZhang07/quantbullet"

[project.optional-dependencies]
torch = ["torch"]
r = ["rpy2>=3.5", "pyarrow"]
docs = [
    "myst-nb>=0.17.2",
    "sphinx",
    "sphinx-autoapi>=2.1",
    "pydata-sphinx-theme>=0.15",
    "nbsphinx",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "yfinance>=0.2",
    "numba",
    "line-profiler",
    "pyyaml",
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
markers = [
    "manual: trigger run from the Test panel; skipped during a full suite run",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
