title: quantbullet editorial slides
author: quantbullet
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      theme: [default, theme.scss]
      width: 1600
      height: 900
      margin: 0.05
      center: false
      transition: none
      slide-number: c/t
      hash-type: number
      navigation-mode: linear
      controls: false
      template-partials:
        - title-slide.html
      filters:
        - sections.lua
      include-in-header:
        - fonts.html
      include-after-body:
        - plotly-resize.html
